<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- Background gradient -->
  <defs>
    <linearGradient id="gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0ea5e9" />
      <stop offset="100%" stop-color="#6366f1" />
    </linearGradient>
  </defs>
  
  <!-- Rounded square background -->
  <rect x="5" y="5" width="90" height="90" rx="20" fill="url(#gradient)" />
  
  <!-- Stylized "W" -->
  <path d="M20 25 L30 70 L40 40 L50 70 L60 40 L70 70 L80 25" 
        stroke="white" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" fill="none" />
  
  <!-- Plane icon -->
  <path d="M65 30 L80 25 L75 35 Z" 
        fill="white" stroke="white" stroke-width="1" />
</svg>
